name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test & Coverage
    runs-on: macos-latest
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 17
      DERIVED: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData/SourcePackages
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build -scheme NaturaPulse -destination "$DESTINATION" -derivedDataPath "$DERIVED"

      - name: Test modules with coverage
        run: |
          set -o pipefail
          for MODULE in Common ExploreFeature SearchFeature SpeciesDetailFeature FieldGuideFeature; do
            SCHEME="$MODULE"
            if [ "$MODULE" = "Common" ]; then SCHEME="Common-Package"; fi
            echo "::group::Test $MODULE"
            ( cd "Modules/$MODULE" && xcodebuild test -scheme "$SCHEME" -destination "$DESTINATION" -derivedDataPath "$DERIVED" -enableCodeCoverage YES -resultBundlePath "$DERIVED/$MODULE.xcresult" )
            echo "::endgroup::"
          done

      - name: Coverage report
        if: always()
        run: |
          for MODULE in Common ExploreFeature SearchFeature SpeciesDetailFeature FieldGuideFeature; do
            echo "== Coverage: $MODULE =="
            xcrun xccov view --report --only-targets "$DERIVED/$MODULE.xcresult" 2>/dev/null || true
          done

  lint:
    name: SwiftLint (code style)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  security:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest

      - name: Scan dependencies for known vulnerabilities
        continue-on-error: true
        run: osv-scanner scan source --recursive ./
