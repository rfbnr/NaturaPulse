# SwiftLint configuration for NaturaPulse
# Rules favor maintainability over excessive strictness (PRD §36).

# Only lint our source; skip generated & dependency code.
included:
  - NaturaPulse
  - NaturaPulseTests
  - NaturaPulseUITests

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "${PWD}/NaturaPulse.xcodeproj"

# Opt-in rules that improve quality without being noisy.
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - last_where
  - sorted_first_last
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces
  - toggle_bool
  - fatal_error_message
  - overridden_super_call
  - force_unwrapping

# Rules that only run via `swiftlint analyze` (needs compiler log).
analyzer_rules:
  - unused_import

disabled_rules:
  - trailing_whitespace   # handled by Xcode; avoids noise on empty lines
  - todo                  # allow TODO/FIXME during development

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

# Domain uses short, meaningful names (id, at, pm25, etc.).
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3
  max_length:
    warning: 45
    error: 55

nesting:
  type_level:
    warning: 3

reporter: "xcode"
